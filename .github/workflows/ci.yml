name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request that supersedes an in-flight run cancels it, so the queue
# reflects the current state of the branch rather than its history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The rules in section 22 that can be machine-checked, checked by machine.
      - name: Copy rules
        run: npm run check:copy

      # The inlined symbol geometry and the brand primitives must still match the
      # supplied masterbrand files. A copy with no check attached drifts.
      - name: Brand fidelity
        run: npm run check:brand

      # Every guaranteed colour pairing, in both schemes. Fails below WCAG 2.2 AA.
      - name: Colour contrast
        run: npm run tokens:contrast

      # The pairing checker cannot see what size text is set at, and axe only
      # visits the seven pages Lighthouse renders. This reads the stylesheets,
      # so a 3:1 token used at body size fails wherever it lives.
      - name: Quiet text is only used at large sizes
        run: npm run check:quiet-text

      - name: Types
        run: npm run check

      - name: Build
        run: npm run build

      # Reads the built output, so it checks what a visitor would actually
      # click. Two main-navigation items and two footer links pointed at pages
      # that had never been built, on every page of the site, and nothing else
      # in this pipeline could see it.
      - name: Internal links resolve
        run: npm run check:links

      # A draft page that loses its noindex gets published; a noindex page
      # nobody recorded stays out of search forever. Both are silent, so the
      # register, the build and the Lighthouse budget are checked against each
      # other rather than trusted.
      - name: Draft register matches the build
        run: npm run check:noindex

      # axe over every built page, both colour schemes. Lighthouse visits ten
      # URLs and the site builds forty-five, and that gap has cost us twice:
      # a 3:1 token used at body size in five components, of which CI saw one,
      # and two composition failures the token checker structurally cannot see.
      - name: Install Chromium for the accessibility sweep
        run: npx --yes playwright@1.62 install --with-deps chromium

      - name: Accessibility, every page
        run: npm run check:a11y

      # The generated redirect map must match its source. A hand edit to
      # public/_redirects would otherwise survive until someone noticed in
      # production that a printed QR code had stopped working.
      - name: Redirect map is in step with its source
        run: |
          node scripts/generate-redirects.mjs
          git diff --exit-code public/_redirects

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  budgets:
    name: Performance and accessibility budgets
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # A missing target surfaces here as one clear line, rather than as
      # several hundred audit exceptions and a generic "unable to load the page".
      - name: Lighthouse targets exist
        run: npm run check:lighthouse-urls

      # Section 21. Lighthouse 95+ across all four categories, LCP under 2.0s,
      # INP proxied by total blocking time, CLS under 0.1, JS under 150KB.
      # assertions live in lighthouserc.json and are enforced, not advisory.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
